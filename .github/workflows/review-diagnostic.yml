name: Review Backend Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reviews-endpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public reviews endpoint
        shell: bash
        run: |
          set -u
          SUPABASE_URL=$(grep 'FALLBACK_SUPABASE_URL' src/integrations/supabase/config.ts | head -1 | sed -E 's/.*"(https:[^"]+)".*/\1/')
          KEY=$(grep 'FALLBACK_SUPABASE_PUBLISHABLE_KEY' src/integrations/supabase/config.ts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          URL="$SUPABASE_URL/rest/v1/reviews?select=id,name,content,rating,is_featured,created_at&is_visible=eq.true&order=is_featured.desc,created_at.desc"
          HTTP=$(curl -sS -o /tmp/reviews.json -w '%{http_code}' \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL" || true)
          echo "HTTP_STATUS=$HTTP"
          echo "RESPONSE_BODY_BEGIN"
          head -c 4000 /tmp/reviews.json || true
          echo
          echo "RESPONSE_BODY_END"
