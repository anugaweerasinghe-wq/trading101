name: TradeHQ Agents

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '41 4 1 * *'
  workflow_dispatch:
    inputs:
      task:
        description: Agent to run
        required: true
        default: scan
        type: choice
        options:
          - scan
          - ideas

permissions:
  contents: read
  issues: write

concurrency:
  group: tradehq-agents
  cancel-in-progress: false

jobs:
  scan:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'scan')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install locked dependencies for route manifest
        run: npm ci
      - name: Scan every authored route without changing production
        run: node --import tsx scripts/agent-monitor.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ideas:
    if: (github.event_name == 'schedule' && github.event.schedule == '41 4 1 * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'ideas')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Suggest two free-tier improvements for human review
        run: node scripts/agent-monthly-ideas.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_AGENT_MODEL: gemini-2.5-flash-lite
