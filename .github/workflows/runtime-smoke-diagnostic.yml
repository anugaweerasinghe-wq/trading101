name: Runtime smoke diagnostic

on:
  push:
    branches:
      - production-runtime-diagnostic-2026-09-26

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install browser test dependency
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tradehq-vite.log 2>&1 &
          echo $! > /tmp/tradehq-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tradehq-vite.log
          exit 1

      - name: Run browser runtime smoke test
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();

          const pageErrors = [];
          const consoleErrors = [];

          page.on('pageerror', (err) => pageErrors.push(String(err?.stack || err)));
          page.on('console', (msg) => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });

          const response = await page.goto('http://127.0.0.1:4173/', {
            waitUntil: 'networkidle',
            timeout: 30000,
          });

          await page.waitForTimeout(1500);

          const bodyText = (await page.locator('body').innerText()).trim();
          const rootHtml = await page.locator('#root').innerHTML();

          console.log('HTTP status:', response?.status());
          console.log('Body text length:', bodyText.length);
          console.log('Root HTML length:', rootHtml.length);
          console.log('Body preview:', bodyText.slice(0, 500));
          console.log('Page errors:', JSON.stringify(pageErrors, null, 2));
          console.log('Console errors:', JSON.stringify(consoleErrors, null, 2));

          await browser.close();

          if (!response || !response.ok()) {
            console.error('Runtime smoke failed: homepage did not return HTTP success.');
            process.exit(1);
          }

          if (pageErrors.length) {
            console.error('Runtime smoke failed: uncaught browser page error(s).');
            process.exit(1);
          }

          if (bodyText.length < 100 || rootHtml.length < 100) {
            console.error('Runtime smoke failed: rendered page appears blank or nearly blank.');
            process.exit(1);
          }

          console.log('Runtime smoke passed.');
          EOF
