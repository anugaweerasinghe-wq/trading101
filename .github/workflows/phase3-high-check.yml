name: Phase 3 High Validation

on:
  push:
    branches: [main, phase3-current-20261003]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/verify-journal-summary.ts
      - run: npm run build
