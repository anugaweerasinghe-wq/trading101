name: Critical branch runtime diagnostic

on:
  push:
    branches:
      - audit/critical-quality-2026-09-26

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tradehq-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tradehq-preview.log
          exit 1
      - name: Browser smoke
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const routes = ['/', '/markets', '/trade', '/portfolio', '/learn', '/about', '/privacy', '/terms', '/wiki/macd'];
          const failures = [];
          for (const route of routes) {
            const page = await browser.newPage();
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e?.stack || e)));
            try {
              const response = await page.goto('http://127.0.0.1:4173' + route, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(1800);
              const rootText = (await page.locator('#root').innerText()).trim();
              const prerenderShellCount = await page.locator('#prerender-seo').count();
              console.log('\nROUTE', route, 'HTTP', response?.status(), 'root chars', rootText.length, 'shell', prerenderShellCount);
              console.log('errors', JSON.stringify(pageErrors, null, 2));
              if (!response || !response.ok()) failures.push(route + ': HTTP failure');
              if (pageErrors.length) failures.push(route + ': uncaught page error');
              if (prerenderShellCount !== 0) failures.push(route + ': React did not replace prerender shell');
              if (rootText.length < 80) failures.push(route + ': root appears blank');
            } catch (e) {
              failures.push(route + ': ' + String(e));
            } finally {
              await page.close();
            }
          }
          await browser.close();
          if (failures.length) {
            console.error('\nSMOKE FAILURES');
            failures.forEach(f => console.error('-', f));
            process.exit(1);
          }
          console.log('\nCritical branch runtime smoke passed.');
          EOF
